name: Repository quality

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Run Gateway crypto checks
        run: >-
          uv run pytest
          edge_gateway/tests/test_mlkem.py
          edge_gateway/tests/test_kdf.py
          edge_gateway/tests/test_symmetric.py
          edge_gateway/tests/test_secure_envelope.py
          edge_gateway/tests/test_transport_trust.py
          edge_gateway/tests/test_security_logging.py
          edge_gateway/tests/test_secure_transport.py
          tests/integration/test_secure_message_tamper.py
          tests/integration/test_gateway_cloud_secure.py
      - name: Run Cloud unit and cross-component checks
        run: >-
          uv run pytest
          cloud_service/tests
          tests/integration/test_gateway_cloud_secure.py
      - run: uv run ai-history check
      - name: Build and verify Cloud container readiness
        run: |
          docker build --file cloud_service/Dockerfile --tag course-cloud-readiness .
          docker run --detach --rm --name course-cloud-readiness \
            --publish 127.0.0.1:9000:9000 \
            --env SECURITY_MODE=mlkem \
            course-cloud-readiness
          trap 'docker logs course-cloud-readiness; docker stop course-cloud-readiness || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/ready \
              && curl --fail --silent --show-error http://127.0.0.1:9000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
