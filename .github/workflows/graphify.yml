name: Graphify shared code graph

on:
  pull_request:
    branches: [develop]
    paths:
      - "**/*.py"
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/pyproject.toml"
      - "uv.lock"

permissions:
  contents: write

concurrency:
  group: graphify-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run graphify extract . --code-only --no-viz
      - run: uv run graphify cluster-only . --no-viz
      - name: Commit refreshed shared graph
        run: |
          if git diff --quiet -- graphify-out; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json graphify-out/GRAPH_REPORT.md graphify-out/manifest.json
          git commit -m "chore: refresh shared Graphify code graph"
          git push
      - name: Verify graph is deterministic and current
        run: |
          uv run graphify extract . --code-only --no-viz
          uv run graphify cluster-only . --no-viz
          git diff --exit-code -- graphify-out
