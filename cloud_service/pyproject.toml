[project]
name = "cloud-service"
version = "0.1.0"
description = "Cloud service component."
requires-python = ">=3.12"
dependencies = ["cryptography>=48", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[project.scripts]
cloud-service = "cloud_service.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_service"]
