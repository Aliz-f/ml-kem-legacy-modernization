[project]
name = "edge-gateway"
version = "0.1.0"
description = "Edge gateway component."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=48",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[project.scripts]
edge-gateway = "edge_gateway.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_gateway"]
