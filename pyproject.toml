[project]
name = "ml-kem-legacy-modernization"
version = "0.1.0"
description = "Course project workspace for legacy modernization and ML-KEM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ai-history = "ai_history.cli:main"

[dependency-groups]
dev = [
    "cloud-service[test]",
    "edge-gateway",
    "legacy-system",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_history"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.uv.workspace]
members = [
    "legacy_system",
    "edge_gateway",
    "cloud_service",
]

[tool.uv.sources]
cloud-service = { workspace = true }
edge-gateway = { workspace = true }
legacy-system = { workspace = true }
